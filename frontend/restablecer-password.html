<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | Alerta Urbana</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="registro-container">

        <section class="registro-card">

            <!-- PANEL IZQUIERDO -->
            <div class="panel-logo">

                <img
                    src="assets/logo-alerta-urbana.png"
                    alt="Logo Alerta Urbana"
                    class="logo-alerta"
                >

                <p>
                    Reportá. Participá. Mejorá tu ciudad.
                </p>

            </div>


            <!-- PANEL DERECHO -->
            <div class="panel-formulario">

                <div class="registro-header">

                    <h1>Nueva contraseña</h1>

                    <p>
                        Ingresá una nueva contraseña para tu cuenta.
                    </p>

                </div>


                <form id="formRestablecer">

                    <div class="campo">

                        <label for="nuevaPassword">
                            Nueva contraseña
                        </label>

                        <input
                            type="password"
                            id="nuevaPassword"
                            name="nuevaPassword"
                            placeholder="Ingresá tu nueva contraseña"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmarPassword">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmarPassword"
                            name="confirmarPassword"
                            placeholder="Repetí tu nueva contraseña"
                            required
                        >

                    </div>


                    <p class="ayuda-password">
                        La contraseña debe tener al menos 8 caracteres,
                        una letra y un número.
                    </p>


                    <div id="mensaje"></div>


                    <button
                        type="submit"
                        class="btn-registro"
                    >
                        Cambiar contraseña
                    </button>

                </form>


                <div class="registro-footer">

                    <p>
                        <a href="login.html">
                            Volver a iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/restablecer-password.js"></script>

</body>

</html>
