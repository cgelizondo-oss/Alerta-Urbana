<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Alerta Urbana</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="registro-container">

        <section class="registro-card">

            <!-- PANEL IZQUIERDO -->
            <div class="panel-logo">

                <img
                    src="assets/logo-alerta-urbana.png"
                    alt="Logo Alerta Urbana"
                    class="logo-alerta"
                >

                <p>
                    Reportá. Participá. Mejorá tu ciudad.
                </p>

            </div>


            <!-- PANEL DERECHO -->
            <div class="panel-formulario">

                <div class="registro-header">

                    <h1>¡Bienvenido!</h1>

                    <p>
                        Ingresá a tu cuenta de Alerta Urbana
                    </p>

                </div>


                <form id="formLogin">

                    <div class="campo">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            required
                        >

                    </div>


                    <div class="opciones-login">

                        <a href="recuperar-password.html">
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <div id="mensaje"></div>


                    <button
                        type="submit"
                        class="btn-registro"
                    >
                        Iniciar sesión
                    </button>

                </form>


                <div class="registro-footer">

                    <p>
                        ¿No tenés una cuenta?

                        <a href="registro.html">
                            Crear cuenta
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
