<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Alerta Urbana</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="registro-container">

        <section class="registro-card">

            <!-- PANEL IZQUIERDO -->
            <div class="panel-logo">

                <img
                    src="assets/logo-alerta-urbana.png"
                    alt="Logo Alerta Urbana"
                    class="logo-alerta"
                >

                <p>
                    Reportá. Participá. Mejorá tu ciudad.
                </p>

            </div>


            <!-- PANEL DERECHO -->
            <div class="panel-formulario">

                <div class="registro-header">

                    <h1>Crear cuenta</h1>

                    <p>
                        Completá tus datos para registrarte
                    </p>

                </div>


                <form id="formRegistro">

                    <div class="campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingresá tu nombre"
                            maxlength="50"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Ingresá tu apellido"
                            maxlength="50"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="localidad">
                            Localidad
                        </label>
                    
                        <input
                            type="text"
                            id="localidad"
                            name="localidad"
                            placeholder="Ej.: Las Pirquitas"
                            maxlength="100"
                            required
                        >
                    
                    </div>
                    
                    
                    <div class="campo">
                    
                        <label for="calle">
                            Calle
                        </label>
                    
                        <input
                            type="text"
                            id="calle"
                            name="calle"
                            placeholder="Ej.: Calle B"
                            maxlength="100"
                            required
                        >
                    
                    </div>
                    
                    
                    <div class="campo">
                    
                        <label for="numero">
                            Número o identificación de vivienda
                        </label>
                    
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Ej.: Casa 34 o S/N"
                            maxlength="20"
                            required
                        >
                    
                    </div>


                    <div class="campo">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmarPassword">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmarPassword"
                            name="confirmarPassword"
                            placeholder="Repetí tu contraseña"
                            required
                        >

                    </div>


                    <p class="ayuda-password">
                        La contraseña debe tener al menos 8 caracteres,
                        una letra y un número.
                    </p>


                    <div id="mensaje"></div>


                    <button
                        type="submit"
                        class="btn-registro"
                    >
                        Crear cuenta
                    </button>

                </form>


                <div class="registro-footer">

                    <p>
                        ¿Ya tenés una cuenta?
                        <a href="login.html">
                            Iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/registro.js"></script>

</body>

</html>
