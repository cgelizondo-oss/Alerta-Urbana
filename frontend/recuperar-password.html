<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Alerta Urbana</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="registro-container">

        <section class="registro-card">

            <!-- PANEL IZQUIERDO -->
            <div class="panel-logo">
                <a href="inicio.html" aria-label="Volver al inicio">
                 <img
                    src="assets/logo-alerta-urbana.png"
                    alt="Logo Alerta Urbana"
                    class="logo-alerta"
                >   
                </a>

                <p>
                    Reportá. Participá. Mejorá tu ciudad.
                </p>

            </div>


            <!-- PANEL DERECHO -->
            <div class="panel-formulario">

                <div class="registro-header">

                    <h1>Recuperar contraseña</h1>

                    <p>
                        Ingresá tu correo electrónico para recuperar
                        el acceso a tu cuenta.
                    </p>

                </div>


                <form id="formRecuperacion">

                    <div class="campo">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>


                    <div id="mensaje"></div>


                    <button
                        type="submit"
                        class="btn-registro"
                    >
                        Continuar
                    </button>

                </form>


                <div class="registro-footer">

                    <p>
                        ¿Recordaste tu contraseña?

                        <a href="login.html">
                            Volver a iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/recuperar-password.js"></script>

</body>

</html>
